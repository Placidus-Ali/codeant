<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            }
    </style>
        <body>
            <center>
            <h2>Table With Border</h2>
            <p>Create a simple table with border and use CSS border property to add a border to the table.</p>
        <table style="width: 50%;">
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Country</th>
            </tr>
            <tr>
                <td>Alfreds Futterkiste</td>
                <td>Maria Anders</td>
                <td>Germany</td>
                </tr>
            <tr>
                <td>Centro comercial Moctezuma</td>
                <td>Francisco Chang</td>
                <td>Mexico</td>
            </tr>
        </table>
            </center>
        </body>
    </head>
</html>
